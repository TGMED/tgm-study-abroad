{% extends "admin_base.html" %}
{% block title %}Admin login — TGM{% endblock %}
{% block admin_content %}
<div class="card" style="max-width:380px;margin:60px auto 0;">
  <h2>Admin login</h2>
  <p style="color:var(--mut);font-size:13.5px;margin:-8px 0 16px;">Internal use only.</p>
  {% if error %}
  <div style="padding:10px 12px;border-radius:8px;margin-bottom:14px;background:#fdecea;color:#8a2e24;font-size:13px;">{{ error }}</div>
  {% endif %}
  <form method="POST" action="{{ url_for('admin.admin_login') }}">
    <input type="hidden" name="next" value="{{ next_url }}" />
    <label style="display:block;font-size:12px;color:var(--mut);margin-bottom:5px;">Username</label>
    <input type="text" name="username" value="{{ username }}" placeholder="admin" autocomplete="username" required autofocus
      style="width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;font-size:14px;margin-bottom:14px;box-sizing:border-box;" />
    <label style="display:block;font-size:12px;color:var(--mut);margin-bottom:5px;">Password</label>
    <input type="password" name="password" placeholder="Your password" autocomplete="current-password" required
      style="width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;font-size:14px;margin-bottom:16px;box-sizing:border-box;" />
    <button class="btn btn-green" type="submit" style="width:100%;justify-content:center;">Log in</button>
  </form>
</div>
{% endblock %}
